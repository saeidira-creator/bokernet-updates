<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LogBok Console</title>
<link rel="icon" href="logo.svg?v=10" type="image/svg+xml">
<link rel="preload" href="vazirmatn.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="app.css?v=44">
</head>
<body>
<aside class="rail" id="rail">
  <div class="brand"><div class="lockup inrail"><img class="bmark" src="logo.svg?v=10" alt="LogBok" width="110" height="90"><div class="wm"><span class="l1">Log</span><span class="l2">Bok</span></div><div class="sp" id="brandSub">Security Package</div></div></div>
  <nav class="navi" id="nav"></nav>
  <div class="sys" id="sysStat"></div>
</aside>
<main class="main">
  <div class="topbar">
    <div class="tleft">
      <label class="gsearch"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M10.5 17.5a7 7 0 1 0 0-14 7 7 0 0 0 0 14zM20.5 20.5l-5-5"/></svg><input id="gsearch" type="search" autocomplete="off"></label>
      <div class="crumbs" id="crumbs"></div>
    </div>
    <div class="tools">
      <span class="live" id="live"><span class="d"></span><span id="liveTxt"></span></span>
      <button type="button" class="rbtn" id="refreshBtn"></button>
      <div class="themeSw" id="themeSw"></div>
      <span class="tsep"></span>
      <div class="who" id="who"></div>
    </div>
  </div>
  <div id="flash" class="flash" hidden></div>
  <div id="view"></div>
</main>
<div class="scrim" id="scrim" hidden></div>
<aside class="drawer" id="drawer" hidden aria-modal="true" role="dialog"></aside>
<script src="app.js?v=44"></script>
</body>
</html>
